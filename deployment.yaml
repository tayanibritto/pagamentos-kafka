apiVersion: apps/v1
kind: Deployment

metadata:
  name: pagamentos-kafka-deployment

spec:
  replicas: 2
  selector:
    matchLabels:
      app: pagamentos-kafka
  template:
    metadata:
      labels:
        app: pagamentos-kafka
    spec:
      containers:
        - name: pagamentos-kafka
          image: localhost/pagamentos-kafka_payment-api:latest
          imagePullPolicy: Never
          env:
            - name: API_TITLE
              value: "Payments API"
            - name: API_VERSION
              value: "1.0.0"
            - name: KAFKA_TOPIC
              value: "payments"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          ports:
            - containerPort: 8000